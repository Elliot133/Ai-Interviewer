apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-interview-frontend
  namespace: ai-interview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-interview-frontend
  template:
    metadata:
      labels:
        app: ai-interview-frontend
    spec:
      containers:
        - name: frontend
          image: ai-interview-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
