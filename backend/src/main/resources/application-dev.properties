# ==========================================================
# Development profile - uses in-memory H2 database.
# Activate with: SPRING_PROFILES_ACTIVE=dev
# ==========================================================

spring.datasource.url=jdbc:h2:mem:ai_interview_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Google Sign-In client ID. Override with GOOGLE_CLIENT_ID when needed.
app.google.client-id=${GOOGLE_CLIENT_ID:783025521305-a4iu7e4bdu9t1padrft7b1ravdagg7a8.apps.googleusercontent.com}
