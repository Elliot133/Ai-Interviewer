# ==========================================================
# AI Interview Simulator - Backend Configuration
# Default profile: uses PostgreSQL. Switch to "dev" for H2.
# ==========================================================

spring.application.name=ai-interview-simulator

# ---------- Active profile ----------
# Set to "dev" to use an in-memory H2 database instead of PostgreSQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- PostgreSQL (production/default) ----------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ai_interview_simulator}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-in-production-please-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- OpenAI ----------
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
# When true, the backend returns deterministic mock questions/evaluations
# instead of attempting the real OpenAI request. Default to true so the
# workspace remains usable when OPENAI_API_KEY is not configured.
app.ai.mock-mode=${AI_MOCK_MODE:true}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---------- Google Sign-In ----------
# OAuth 2.0 Client ID from Google Cloud Console. Used to verify that Google
# ID tokens sent by the frontend were issued for this application.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---------- Interview defaults ----------
app.interview.seconds-per-question=${SECONDS_PER_QUESTION:180}

# ---------- Logging ----------
logging.level.com.aiinterview=INFO
logging.level.com.aiinterview.service.InterviewService=DEBUG
logging.level.org.springframework.security=WARN
